<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>recipes</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="body-container">
  <header>
   
    <p>RECIPEBOOK</p>
      <button id="toggle-button">Favourites <span id="favorite-count">0</span></button>
  </header>
    
  
     <main class="">
      <h2 class="title">Recipes Book</h2>
       <form id="search-form">
        <input type="text" id="search-input">
        <button>
           Search
        </button>
       </form>
       <p id="message"></p>
       <section >
      <div id="characters">
        <h2>All characters</h2>
      </div>
       </section>
       </div>
       <div class="overlay" id="overlay"></div>
         <section  class="favourites-drawer" id="drawer">
          <div class="fav-header">
          <h2>Favorite Recipes</h2>
            <button class="close-button">&times;</button>
            </div>
           <div id="favorites"></div>
          </section>
          
        
        
     </main>

     <script src="script.js"></script>
</body>
</html>
